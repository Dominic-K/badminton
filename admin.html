<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배드민턴 클라우드 관리자 시스템</title>
    <!-- 💡 서버 저장을 위해 파이어베이스 연결 추가 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { text-align: center; background-color: #0b5394; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .container { display: flex; gap: 20px; }
        .left-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #eeeeee; cursor: pointer; }
        th:hover { background-color: #ddd; }
        .right-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-row { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
        .form-row label { font-weight: bold; font-size: 14px; width: 40%; cursor: help; }
        .form-row input, .form-row select { width: 55%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-add { background-color: #93c47d; color: white; margin-top: 10px; }
        .btn-edit { background-color: #ffd966; color: #333; }
        .btn-delete { background-color: #e06666; color: white; }
        .btn-generate { background-color: #3d85c6; color: white; font-size: 16px; padding: 15px; height: 100%; }
        .bottom-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px; display: flex; gap: 20px; }
        .settings-box { flex: 3; display: flex; flex-direction: column; gap: 15px; }
        .settings-row { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .settings-row label { font-weight: bold; cursor: help; }
        .settings-row input[type="time"], .settings-row input[type="number"] { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .generate-box { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏆 <span id="dynamic-club-name">클럽이름</span> 클라우드 관리자 시스템 🏆</h2>
        <p>클럽 총무 전용 대시보드</p>
    </div>

    <div class="container">
        <!-- 왼쪽: 선수 목록 -->
        <div class="left-panel">
            <h3>👥 출전 선수 명단 <span id="sync-status" style="font-size:12px; color:green; font-weight:normal;">(서버 동기화 됨)</span></h3>
            <table>
                <thead>
                    <tr><th>이름</th><th>성별</th><th>수준</th><th>늦참</th><th>조퇴</th><th>최소보장</th><th>지정파트너</th><th>기피파트너</th></tr>
                </thead>
                <tbody id="player-list">
                    <tr><td colspan="8">등록된 선수가 없습니다.</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 오른쪽: 선수 등록 폼 -->
        <div class="right-panel">
            <h3>⚙️ 선수 등록 / 수정</h3>
            <div class="form-row"><label>이름</label><input type="text" id="name" placeholder="이름 입력"></div>
            <div class="form-row"><label>성별</label><select id="gender"><option>남</option><option>여</option></select></div>
            <div class="form-row"><label>수준 (1~30)</label><input type="number" id="skill" value="15" min="1" max="30"></div>
            <div class="form-row"><label>늦참 (분)</label><select id="late_min"><option value="0">정상 출석</option><option value="15">15분</option><option value="30">30분</option><option value="45">45분</option><option value="60">60분</option></select></div>
            <div class="form-row"><label>조퇴 (분)</label><select id="early_min"><option value="0">풀타임</option><option value="15">15분</option><option value="30">30분</option><option value="45">45분</option><option value="60">60분</option></select></div>
            <div class="form-row"><label>최소 보장(경기)</label><input type="number" id="min_games" value="0" min="0" max="10"></div>
            <div class="form-row"><label>지정 파트너</label><input type="text" id="pref_partner" placeholder="이름 입력"></div>
            <div class="form-row"><label>기피 파트너</label><input type="text" id="avoid_partner" placeholder="이름 입력"></div>

            <button class="btn btn-add">➕ 선수 신규 등록</button>
            <button class="btn btn-edit">✏️ 선택 선수 정보 수정</button>
            <button class="btn btn-delete">❌ 선택 삭제</button>
        </div>
    </div>

    <!-- 하단: 매칭 환경 설정 -->
    <div class="bottom-panel">
        <div class="settings-box">
            <div class="settings-row"><label>⏱️ 대회 시간 :</label><input type="time" id="start_time" value="06:00"> ~ <input type="time" id="end_time" value="08:30"> &nbsp;|&nbsp; <label>1경기 진행:</label> <input type="number" id="match_duration" value="13" style="width: 50px;"> 분</div>
            <div class="settings-row"><label>🎉 이벤트 타임 :</label><input type="checkbox" id="use_event" checked> 사용함 &nbsp; <input type="time" id="ev_start_time" value="07:00"> ~ <input type="time" id="ev_end_time" value="07:15"></div>
            <div class="settings-row"><label>🏸 경기 종목 :</label><label><input type="checkbox" id="use_md" checked> 남복</label><label><input type="checkbox" id="use_wd" checked> 여복</label><label><input type="checkbox" id="use_mix" checked> 혼복</label></div>
        </div>
        <div class="generate-box">
            <button class="btn btn-generate">▶ 대진표 자동 생성</button>
        </div>
    </div>

    <script>
        // 파이어베이스 세팅
        const firebaseConfig = {
            apiKey: "AIzaSyB95N1y6-uAXUp19Quzv08_yqmRpIlzZlQ",
            authDomain: "badminton-ed485.firebaseapp.com",
            projectId: "badminton-ed485",
            storageBucket: "badminton-ed485.firebasestorage.app",
            messagingSenderId: "1021547725240",
            appId: "1:1021547725240:web:099bf98b77db2965d84f4d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 💡 클럽 인증 및 닉네임 가져오기
        const clubId = localStorage.getItem('clubId');
        const clubName = localStorage.getItem('clubName');
        if (!clubId) { window.location.href = "index.html"; }
        document.getElementById('dynamic-club-name').innerText = clubName;

        let players = [];
        let editingPlayerName = null;

        // 💡 화면 켜지면 파이어베이스 서버에서 명단 불러오기 (없으면 로컬스토리지)
        db.collection("clubs").doc(clubId).get().then(doc => {
            if (doc.exists && doc.data().roster) {
                players = doc.data().roster;
                renderTable();
            } else {
                const savedPlayers = localStorage.getItem('naruminton_players');
                if (savedPlayers) { players = JSON.parse(savedPlayers); renderTable(); }
            }
        });

        document.querySelector('.btn-add').addEventListener('click', addPlayer);
        document.querySelector('.btn-edit').addEventListener('click', editPlayer);
        document.querySelector('.btn-delete').addEventListener('click', deletePlayer);
        document.querySelector('.btn-generate').addEventListener('click', generateMatches);

        function renderTable() {
            const tbody = document.getElementById('player-list');
            tbody.innerHTML = '';
            if (players.length === 0) { tbody.innerHTML = '<tr><td colspan="8">등록된 선수가 없습니다.</td></tr>'; return; }
            players.sort((a, b) => a.name.localeCompare(b.name));
            players.forEach(p => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.onclick = () => loadPlayerToForm(p);
                tr.innerHTML = `<td><b>${p.name}</b></td><td>${p.gender}</td><td>${p.skill}</td><td>${p.late_min > 0 ? p.late_min + '분' : '-'}</td><td>${p.early_min > 0 ? p.early_min + '분' : '-'}</td><td>${p.min_games > 0 ? p.min_games + '경기' : '-'}</td><td style="color:blue;">${p.pref_partner || '-'}</td><td style="color:red;">${p.avoid_partner || '-'}</td>`;
                tbody.appendChild(tr);
            });
        }

        function loadPlayerToForm(p) {
            document.getElementById('name').value = p.name; document.getElementById('gender').value = p.gender; document.getElementById('skill').value = p.skill; document.getElementById('late_min').value = p.late_min; document.getElementById('early_min').value = p.early_min; document.getElementById('min_games').value = p.min_games; document.getElementById('pref_partner').value = p.pref_partner || ''; document.getElementById('avoid_partner').value = p.avoid_partner || '';
            editingPlayerName = p.name;
        }

        function addPlayer() {
            const name = document.getElementById('name').value.trim();
            if (!name) return alert("이름을 입력해주세요!");
            if (players.some(p => p.name === name)) return alert("이미 등록된 이름입니다.");
            players.push({ name: name, gender: document.getElementById('gender').value, skill: parseInt(document.getElementById('skill').value) || 15, late_min: parseInt(document.getElementById('late_min').value) || 0, early_min: parseInt(document.getElementById('early_min').value) || 0, min_games: parseInt(document.getElementById('min_games').value) || 0, pref_partner: document.getElementById('pref_partner').value.trim(), avoid_partner: document.getElementById('avoid_partner').value.trim() });
            saveAndRefresh(); clearForm();
        }

        function editPlayer() {
            if (!editingPlayerName) return alert("선택된 선수가 없습니다.");
            const newName = document.getElementById('name').value.trim();
            if (newName !== editingPlayerName && players.some(p => p.name === newName)) return alert("이미 존재하는 이름입니다.");
            const index = players.findIndex(p => p.name === editingPlayerName);
            if (index !== -1) {
                players[index] = { name: newName, gender: document.getElementById('gender').value, skill: parseInt(document.getElementById('skill').value) || 15, late_min: parseInt(document.getElementById('late_min').value) || 0, early_min: parseInt(document.getElementById('early_min').value) || 0, min_games: parseInt(document.getElementById('min_games').value) || 0, pref_partner: document.getElementById('pref_partner').value.trim(), avoid_partner: document.getElementById('avoid_partner').value.trim() };
            }
            saveAndRefresh(); clearForm();
        }

        function deletePlayer() {
            if (!editingPlayerName) return;
            if (confirm("정말 삭제하시겠습니까?")) {
                players = players.filter(p => p.name !== editingPlayerName);
                saveAndRefresh(); clearForm();
            }
        }

        function saveAndRefresh() {
            renderTable();
            localStorage.setItem('naruminton_players', JSON.stringify(players));
            // 💡 서버(파이어베이스)에 명단 0.1초만에 자동 저장(동기화)
            document.getElementById('sync-status').innerText = "(서버 동기화 중...)";
            document.getElementById('sync-status').style.color = "red";
            db.collection("clubs").doc(clubId).set({ roster: players }, { merge: true }).then(() => {
                document.getElementById('sync-status').innerText = "(서버 동기화 완료)";
                document.getElementById('sync-status').style.color = "green";
            });
        }

        function clearForm() {
            document.getElementById('name').value = ''; document.getElementById('pref_partner').value = ''; document.getElementById('avoid_partner').value = ''; editingPlayerName = null;
        }

        function generateMatches() {
            if (players.length < 16) return alert(`최소 16명 필요!`);
            const settings = { start_time: document.getElementById('start_time').value, end_time: document.getElementById('end_time').value, match_duration: parseInt(document.getElementById('match_duration').value) || 13, use_event: document.getElementById('use_event').checked, ev_start_time: document.getElementById('ev_start_time').value, ev_end_time: document.getElementById('ev_end_time').value, use_md: document.getElementById('use_md').checked, use_wd: document.getElementById('use_wd').checked, use_mix: document.getElementById('use_mix').checked };
            localStorage.setItem('naruminton_settings', JSON.stringify(settings));
            window.location.href = "match.html";
        }
    </script>
</body>
</html>
